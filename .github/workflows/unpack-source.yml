name: Extract project source for rebuild
on:
  push:
    branches:
      - rebuild/combat-foundation
    paths:
      - .github/workflows/unpack-source.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/combat-foundation
      - name: Extract original project archive
        run: |
          set -euo pipefail
          test -f jjsmod.zip
          mkdir -p extracted
          unzip -q jjsmod.zip -d extracted
          test -f extracted/jjsmod/build.gradle
          mkdir -p source
          cp -a extracted/jjsmod/. source/
      - name: Commit extracted source on rebuild branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Extract original mod source for combat rebuild"
          git push origin rebuild/combat-foundation
